{% extends "base.html" %}
{% block content %}
<h1>Kategori</h1>

<div class="form-card">
    <form method="POST">
        <div class="field">
            <label for="nama">Nama Kategori</label>
            <input type="text" id="nama" name="nama" required>
        </div>
        <div class="field">
            <label for="jenis">Jenis</label>
            <select id="jenis" name="jenis" required>
                <option value="masuk">Masuk</option>
                <option value="keluar">Keluar</option>
            </select>
        </div>
        <button type="submit" class="btn">Tambah Kategori</button>
    </form>
</div>

<table class="ledger-table">
    <thead>
        <tr><th>Nama</th><th>Jenis</th><th>Aksi</th></tr>
    </thead>
    <tbody>
    {% for k in kategori %}
    <tr>
        <td>{{ k.nama }}</td>
        <td>
            {% if k.jenis == 'masuk' %}
                <span class="tag tag-masuk">Masuk</span>
            {% else %}
                <span class="tag tag-keluar">Keluar</span>
            {% endif %}
        </td>
        <td>
            <form method="POST" action="{{ url_for('hapus_kategori', id=k.id) }}">
                <button type="submit" class="btn btn-danger" onclick="return confirm('Yakin hapus kategori ini?')">Hapus</button>
            </form>
        </td>
    </tr>
    {% else %}
    <tr><td colspan="3">Belum ada kategori. Tambahkan dulu sebelum bisa input transaksi.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
