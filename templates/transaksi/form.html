{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit Transaksi' if transaksi else 'Tambah Transaksi' }}</h1>

<div class="form-card">
<form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
        <label for="tanggal">Tanggal</label>
        <input type="date" id="tanggal" name="tanggal" value="{{ transaksi.tanggal if transaksi else '' }}">
    </div>

    <div class="field">
        <label for="jenis">Jenis</label>
        <select id="jenis" name="jenis" required>
            <option value="masuk" {{ 'selected' if transaksi and transaksi.jenis == 'masuk' }}>Masuk</option>
            <option value="keluar" {{ 'selected' if transaksi and transaksi.jenis == 'keluar' }}>Keluar</option>
        </select>
    </div>

    <div class="field">
        <label for="kategori_id">Kategori</label>
        <select id="kategori_id" name="kategori_id" required>
            {% for k in kategori_list %}
            <option value="{{ k.id }}" {{ 'selected' if transaksi and transaksi.kategori_id == k.id }}>{{ k.nama }} ({{ k.jenis }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="field">
        <label for="jumlah">Jumlah</label>
        <input type="number" id="jumlah" name="jumlah" step="0.01" required value="{{ transaksi.jumlah if transaksi else '' }}">
    </div>

    <div class="field">
        <label for="keterangan">Keterangan</label>
        <textarea id="keterangan" name="keterangan">{{ transaksi.keterangan if transaksi else '' }}</textarea>
    </div>

    <div class="field">
        <label for="metode">Metode</label>
        <select id="metode" name="metode">
            <option value="cash" {{ 'selected' if transaksi and transaksi.metode == 'cash' }}>Cash</option>
            <option value="transfer" {{ 'selected' if transaksi and transaksi.metode == 'transfer' }}>Transfer</option>
        </select>
    </div>

    <div class="field">
        <label for="bukti">Upload Bukti (foto struk)</label>
        <input type="file" id="bukti" name="bukti" accept="image/*">
        {% if transaksi and transaksi.bukti_url %}
        <div class="field-hint">Bukti saat ini: <a href="{{ transaksi.bukti_url }}" target="_blank">Lihat foto</a> (upload baru untuk mengganti)</div>
        {% endif %}
    </div>

    <button type="submit" class="btn">Simpan</button>
</form>
</div>
{% endblock %}
